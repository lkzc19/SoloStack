[package]
name = "solostack-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
dirs = "5"
flate2 = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
